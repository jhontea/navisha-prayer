# Bootstrap (HTTP-only) Nginx config for prayer.navisha.cloud
#
# Use this ONLY for the first-time TLS certificate issuance. It contains no
# ssl_* directives, so `nginx -t` passes even before any certificate exists —
# which is what lets the certbot nginx plugin run.
#
# Workflow:
#   1. Enable this file (NOT the full one yet):
#        sudo cp deploy/nginx/prayer.navisha.cloud.http.conf \
#                /etc/nginx/sites-available/prayer.navisha.cloud.conf
#        sudo ln -s /etc/nginx/sites-available/prayer.navisha.cloud.conf \
#                   /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx
#   2. Issue the certificate:
#        sudo certbot --nginx -d prayer.navisha.cloud
#   3. Swap in the full TLS config (prayer.navisha.cloud.conf) and reload:
#        sudo cp deploy/nginx/prayer.navisha.cloud.conf \
#                /etc/nginx/sites-available/prayer.navisha.cloud.conf
#        sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name prayer.navisha.cloud;

    # Allow ACME HTTP-01 challenges for certificate issuance/renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Proxy everything to the frontend so the site is usable over HTTP while
    # the certificate is being issued. Certbot will add the HTTPS redirect.
    location /api/ {
        proxy_pass         http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass         http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
