# Nginx site config for prayer.navisha.cloud
#
# Place this on the VPS at:
#   /etc/nginx/sites-available/prayer.navisha.cloud.conf
# then symlink and reload:
#   sudo ln -s /etc/nginx/sites-available/prayer.navisha.cloud.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS is managed by Certbot (see DEPLOYMENT.md). After running certbot the
# HTTPS server block below will be filled in automatically; this file documents
# the intended final state.

# ---- HTTP: redirect everything to HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name prayer.navisha.cloud;

    # Allow ACME HTTP-01 challenges for certificate issuance/renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS: reverse proxy to the dockerized app ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name prayer.navisha.cloud;

    # Managed by Certbot
    ssl_certificate     /etc/letsencrypt/live/prayer.navisha.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prayer.navisha.cloud/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 2m;

    # ---- API → Go backend (container bound to 127.0.0.1:8010) ----
    location /api/ {
        proxy_pass         http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ---- Everything else → Next.js frontend (container bound to 127.0.0.1:3010) ----
    location / {
        proxy_pass         http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
